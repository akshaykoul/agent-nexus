[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-nexus-scanner"
version = "0.1.0"
description = "Read-only discovery of AI agents, MCP servers and models for Agent Nexus"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["boto3>=1.40"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
agent-nexus-scan = "nexus_scanner.cli:main"

[tool.setuptools]
packages = ["nexus_scanner"]
