<title>Agent Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: fixed left rail + scrolling work area; dense, scan-first panels. */
:root {
  --bg: #F3F5F7;
  --surface: #FFFFFF;
  --surface-2: #EDF1F4;
  --ink: #111B27;
  --ink-2: #44525F;
  --muted: #74818E;
  --line: #D9E0E6;
  --rail: #0F1D2A;
  --rail-ink: #C9D5DF;
  --rail-hi: #FFFFFF;
  --accent: #0A7A73;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFEC;
  --ok: #1F8A57;   --ok-soft: #DDF1E6;
  --warn: #B26B00; --warn-soft: #FBEBD0;
  --crit: #C2362D; --crit-soft: #F9DEDB;
  --info: #2E66C7; --info-soft: #DFE8F8;
  --shadow: 0 1px 2px rgba(17,27,39,.06), 0 4px 16px rgba(17,27,39,.05);
  --f-display: 'Sora', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D141C; --surface: #141D27; --surface-2: #1B2632; --ink: #E5ECF2; --ink-2: #A9B6C2; --muted: #7D8B98; --line: #283543;
  --rail: #09111A; --rail-ink: #A9B8C5; --rail-hi: #FFFFFF; --accent: #2DB3A8; --accent-ink: #062320; --accent-soft: #123B38;
  --ok: #4CC08A; --ok-soft: #12392A; --warn: #E3A440; --warn-soft: #3D2C10; --crit: #F0756B; --crit-soft: #42201D; --info: #74A3F2; --info-soft: #1A2B47;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D141C; --surface: #141D27; --surface-2: #1B2632; --ink: #E5ECF2; --ink-2: #A9B6C2; --muted: #7D8B98; --line: #283543;
  --rail: #09111A; --rail-ink: #A9B8C5; --rail-hi: #FFFFFF; --accent: #2DB3A8; --accent-ink: #062320; --accent-soft: #123B38;
  --ok: #4CC08A; --ok-soft: #12392A; --warn: #E3A440; --warn-soft: #3D2C10; --crit: #F0756B; --crit-soft: #42201D; --info: #74A3F2; --info-soft: #1A2B47;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: 100%; }
.side { background: var(--rail); color: var(--rail-ink); display: flex; flex-direction: column; padding: 18px 12px; gap: 18px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--rail-hi); text-decoration: none; padding: 4px 8px; }
.brand svg { color: #4FD1C5; flex: none; }
.brand b { font-family: var(--f-display); font-size: 16px; letter-spacing: -.01em; display: block; }
.brand small { display: block; font-size: 11px; color: var(--rail-ink); opacity: .8; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--rail-ink); text-decoration: none; font-weight: 500; }
.nav a svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav a:hover { background: rgba(255,255,255,.06); color: var(--rail-hi); }
.nav a.on { background: rgba(79,209,197,.14); color: var(--rail-hi); }
.nav a.on svg { color: #4FD1C5; opacity: 1; }
.nav .badge { margin-left: auto; font-size: 11px; background: #E2574C; color: #fff; padding: 1px 7px; border-radius: 99px; font-variant-numeric: tabular-nums; }
.nav .badge.soft { background: rgba(255,255,255,.12); color: var(--rail-ink); }
.nav-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; padding: 10px 10px 4px; opacity: .55; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 8px; }
.tenant { display: flex; gap: 10px; align-items: center; }
.tenant b { display: block; color: var(--rail-hi); font-weight: 500; font-size: 13px; }
.tenant small { font-size: 11.5px; opacity: .75; }
.link-btn { background: none; border: 0; padding: 0; color: var(--rail-ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 12px; text-align: left; opacity: .8; }

.main { display: flex; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; }
.top { display: flex; align-items: center; gap: 16px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
.search { position: relative; flex: 1; max-width: 520px; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 8px; padding: 0 10px; color: var(--muted); }
.search input { border: 0; background: transparent; padding: 9px 0; width: 100%; outline: none; color: var(--ink); }
.search-results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); z-index: 30; max-height: 360px; overflow: auto; padding: 6px; }
.search-results button { display: flex; width: 100%; gap: 10px; align-items: center; text-align: left; border: 0; background: none; padding: 8px; border-radius: 6px; cursor: pointer; color: var(--ink); }
.search-results button:hover { background: var(--surface-2); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.env-pill { font-size: 12px; color: var(--ok); background: var(--ok-soft); padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
.me { display: flex; align-items: center; gap: 10px; }
.me b { display: block; font-size: 13px; font-weight: 500; }
.me small { display: block; font-size: 11.5px; color: var(--muted); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 600; font-size: 12px; flex: none; }
#view { flex: 1; overflow-y: auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 48px 24px; outline: none; }

/* Page header */
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin-bottom: 20px; }
.ph h1 { font-family: var(--f-display); font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.ph p { margin: 4px 0 0; color: var(--ink-2); max-width: 70ch; }
.ph .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 8px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, var(--line)); }
.btn.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }

/* Panels */
.grid { display: grid; gap: 16px; }
.g-kpi { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.g-2 { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.panel h2 { font-size: 13px; font-weight: 600; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.panel h2 .muted { font-weight: 400; }
.panel h2 a, .panel h2 .right { margin-left: auto; font-weight: 500; font-size: 12.5px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; cursor: pointer; text-align: left; }
.kpi:hover { border-color: var(--accent); }
.kpi .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.kpi .val { font-family: var(--f-display); font-size: 28px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .sub { font-size: 12.5px; color: var(--ink-2); }
.kpi.alert .val { color: var(--crit); }
.kpi.warnk .val { color: var(--warn); }

/* Banner */
.banner { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: var(--r); padding: 14px 18px; margin-bottom: 16px; }
.banner b { display: block; }
.banner .btn { margin-left: auto; }

/* Chips and pills */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; line-height: 1.6; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.crit { background: var(--crit-soft); color: var(--crit); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.chip svg { width: 12px; height: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--muted); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.crit { background: var(--crit); } .dot.info { background: var(--info); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }

/* Platform monogram tile */
.pt { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; font: 600 10px/1 var(--f-mono); letter-spacing: .02em; color: #fff; flex: none; position: relative; overflow: hidden; }
.pt::after { content: ""; position: absolute; inset: auto -6px -10px auto; width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.18); }
.pt.lg { width: 44px; height: 44px; border-radius: 10px; font-size: 12px; }
.pt.sm { width: 22px; height: 22px; border-radius: 5px; font-size: 8px; }

/* Tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
tr.flash td { animation: flash 2.2s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
.cell-name { display: flex; align-items: center; gap: 10px; min-width: 220px; }
.cell-name b { font-weight: 500; display: block; }
.cell-name small { color: var(--muted); font-size: 12px; display: block; }

/* Score */
.score { display: inline-flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; font-weight: 600; }
.score .bar { width: 54px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.score .bar i { display: block; height: 100%; border-radius: 3px; }
.ring { position: relative; width: 84px; height: 84px; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring .v { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--f-display); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
.ring .v small { display: block; font: 500 9.5px var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-top: 4px; }

/* Bars chart */
.hbars { display: flex; flex-direction: column; gap: 9px; }
.hbar { display: grid; grid-template-columns: 150px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 12.5px; }
.hbar .lab { display: flex; gap: 8px; align-items: center; min-width: 0; }
.hbar .lab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; display: flex; }
.hbar .track i { height: 100%; display: block; transition: width .6s ease; }
.hbar .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 12px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* Heat matrix */
.heat { display: grid; grid-template-columns: 74px repeat(5, minmax(0, 1fr)); gap: 4px; font-size: 12px; }
.heat .h { color: var(--muted); font-size: 11px; text-align: center; padding: 2px 0 4px; line-height: 1.25; }
.heat .r { color: var(--ink-2); display: flex; align-items: center; font-weight: 500; }
.heat .c { border-radius: 6px; height: 40px; display: grid; place-items: center; font-weight: 600; font-variant-numeric: tabular-nums; background: var(--surface-2); color: var(--ink-2); cursor: pointer; border: 0; }
.heat .c.z { color: var(--muted); font-weight: 400; cursor: default; }

/* Lists */
.list { display: flex; flex-direction: column; }
.li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.li:last-child { border-bottom: 0; }
a.li:hover b, button.li:hover b { color: var(--accent); }
button.li { background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; cursor: pointer; width: 100%; }
.li .grow { flex: 1; min-width: 0; }
.li b { font-weight: 500; display: block; }
.li small { color: var(--muted); font-size: 12px; display: block; }
.sev { width: 4px; align-self: stretch; border-radius: 2px; flex: none; background: var(--muted); }
.sev.crit { background: var(--crit); } .sev.warn { background: var(--warn); } .sev.info { background: var(--info); } .sev.ok { background: var(--ok); }

/* Tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--ink-2); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.tabs button .chip { font-size: 11px; }

/* Filters */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.filters select, .filters input[type=search] { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
.filters input[type=search] { min-width: 220px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { white-space: nowrap; border: 0; background: none; padding: 7px 12px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

/* Connector cards */
.conns { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.conn { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; text-align: left; cursor: pointer; }
.conn:hover { border-color: var(--accent); }
.conn.new { border-style: dashed; border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
.conn .head { display: flex; gap: 10px; align-items: center; }
.conn b { font-weight: 500; display: block; line-height: 1.3; }
.conn small { color: var(--muted); font-size: 12px; display: block; }
.conn .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); align-items: center; gap: 8px; }

/* Platform picker */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pgrid button { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; text-align: left; position: relative; }
.pgrid button:hover { border-color: var(--accent); }
.pgrid button.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.pgrid button b { font-weight: 500; font-size: 13px; line-height: 1.3; }
.pgrid button small { color: var(--muted); font-size: 11.5px; }
.pgrid .tag { position: absolute; top: 10px; right: 10px; }

/* Drawer */
.drawer-scrim { position: fixed; inset: 0; background: rgba(9,17,26,.45); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--bg); z-index: 41; display: flex; flex-direction: column; box-shadow: -8px 0 32px rgba(0,0,0,.18); animation: slide .22s ease-out; }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer header { display: flex; align-items: center; gap: 12px; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px 22px; background: var(--surface); border-bottom: 1px solid var(--line); }
.drawer header h2 { margin: 0; font-family: var(--f-display); font-size: 18px; font-weight: 600; }
.drawer header .x { margin-left: auto; }
.drawer .body { flex: 1; overflow-y: auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px 22px; }
.drawer footer { padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) 22px; background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.steps { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
.steps span { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.steps span.on { background: var(--accent); color: var(--accent-ink); }
.steps span.done { background: var(--accent-soft); color: var(--accent); }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 11px; width: 100%; }
.field textarea { min-height: 84px; resize: vertical; }
.field .hint { font-size: 12px; color: var(--muted); }
.checks { display: flex; flex-direction: column; gap: 8px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.check b { font-weight: 500; display: block; }
.check small { color: var(--muted); font-size: 12px; }

/* Scan console */
.console { background: #0B141D; color: #C6D3DE; border-radius: 10px; padding: 14px 16px; font: 12.5px/1.65 var(--f-mono); height: 340px; overflow-y: auto; }
.console .ln { display: flex; gap: 10px; animation: fadein .25s ease-out; }
.console .ln .t { color: #5C7183; flex: none; }
.console .ln.step { color: #FFFFFF; font-weight: 500; margin-top: 6px; }
.console .ln.found { color: #6FE0C8; }
.console .ln.warn { color: #F3B65B; }
.console .ln.done { color: #8EE59F; font-weight: 500; }
@keyframes fadein { from { opacity: 0; transform: translateY(3px); } }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin: 14px 0 6px; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
.scan-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }

<script>
/* Agent Nexus — demo application. Plain JS, hash-routed, state kept in memory (+ localStorage when available). */
(function () {
'use strict';

/* ---------- utilities ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const fmt = n => Number(n).toLocaleString('en-AU');
const KEY = 'agent-nexus-demo-v2';

function hash(str) { // two FNV-1a passes → 16 hex chars; good enough to demo a hash chain
  let h1 = 0x811c9dc5, h2 = 0x01000193 ^ 0x5bd1e995;
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 ^= c; h1 = Math.imul(h1, 16777619); h2 ^= c + 7; h2 = Math.imul(h2, 16777619); }
  return ((h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0'));
}
function nowStamp() { const d = new Date(); return '2026-10-29 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

function chainAudit(list) { // list newest-first; recompute hashes oldest→newest
  let prev = '0000000000000000';
  for (let i = list.length - 1; i >= 0; i--) { const e = list[i]; e.prev = prev; e.hash = hash(prev + '|' + e.ts + '|' + e.actor + '|' + e.type + '|' + e.text + '|' + (e.ref || '')); prev = e.hash; }
  return list;
}
function seedAudit() { return chainAudit(AUDIT_SEED.map(([ts, actor, type, text, ref]) => ({ ts, actor, type, text, ref }))); }

function fresh() { return { v: 2, connectors: clone(CONNECTORS), agents: clone(BASE_AGENTS), reviews: clone(REVIEWS), incidents: clone(INCIDENTS), audit: seedAudit(), seqR: 316, seqI: 2042 }; }
function load() { try { const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }
let S = load() || fresh();

function audit(actor, type, text, ref) {
  const prev = S.audit.length ? S.audit[0].hash : '0000000000000000';
  const e = { ts: nowStamp(), actor, type, text, ref: ref || '' };
  e.prev = prev; e.hash = hash(prev + '|' + e.ts + '|' + e.actor + '|' + e.type + '|' + e.text + '|' + e.ref);
  S.audit.unshift(e); save();
}

function precheck(r) {
  const f = [];
  if (r.customerFacing && /L3/.test(r.autonomy) && /none/i.test(r.hitl)) f.push(['crit', 'Customer-facing agent acts on its own with no human oversight proposed']);
  const miss = r.guardrails.map((v, i) => v ? null : GUARDRAILS[i].split(' ')[0]).filter(Boolean);
  if (miss.length) f.push([miss.length > 2 ? 'crit' : 'warn', `No evidence for guardrails ${miss.join(', ')}`]);
  if (r.pia !== 'Completed' && r.pia !== 'Not required') f.push(['warn', `Privacy impact assessment: ${r.pia.toLowerCase()}`]);
  if (r.evals.groundedness == null) f.push(['warn', 'No evaluation results submitted yet']);
  if (r.evals.redteam != null && r.evals.redteam < 90) f.push(['warn', `Red-team pass rate ${r.evals.redteam}% is below the 90% bar`]);
  if (r.evals.bias === 'Not run' && r.customerFacing) f.push(['warn', 'Bias testing not run for a customer-facing agent']);
  if (/Material|assessed/.test(r.cps230)) f.push(['info', 'May support a CPS 230 material service: Operational Risk sign-off needed']);
  if (r.source === 'Scan') f.push(['info', 'Found by scan already running in production without intake approval']);
  if (!f.length) f.push(['ok', 'All intake checks passed']);
  return f;
}
function viewReviews() {

  if (!UI.revSel || !S.reviews.find(r => r.id === UI.revSel)) UI.revSel = (list[0] || {}).id;

  const q = list.map(x => `<button class="${x.id === UI.revSel ? 'on' : ''}" data-rev="${x.id}">${pt(x.platform, 'sm')}<span class="grow"><b>${esc(x.agent)}</b><small>${x.id} · ${esc(x.submitter)} · ${x.source === 'Scan' ? 'from scan' : 'submitted ' + x.submitted.slice(5)}</small></span>${x.status === 'Pending' ? riskChip(x.risk) : statusChip(x.status)}</button>`).join('') || '<div class="empty">Queue is clear.</div>';
  return `<div class="ph"><div><h1>Review workbench</h1><p>New agents and changes waiting for GRC sign-off. Decisions update the registry and are written to the audit log.</p></div></div>
    <div class="wb"><div class="queue"><div class="qhead"><span class="seg">${['Pending', 'Decided', 'All'].map(k => `<button data-revf="${k}" class="${UI.revFilter === k ? 'on' : ''}">${k}${k === 'Pending' ? ` (${S.reviews.filter(x => x.status === 'Pending').length})` : ''}</button>`).join('')}</span></div>${q}</div>

      <div><small>Privacy impact assessment</small>${statusChip(r.pia === 'Completed' || r.pia === 'Not required' ? 'Done' : r.pia === 'In progress' ? 'In progress' : 'Open').replace(/>(Done|In progress|Open)</, '>' + esc(r.pia) + '<')}</div><div><small>CPS 230 materiality</small>${esc(r.cps230)}</div>

      <div><b style="color:${ev.redteam == null ? 'var(--muted)' : toneVar(ev.redteam >= 90 ? 'ok' : 'warn')}">${ev.redteam == null ? '—' : ev.redteam + '%'}</b><small>Red-team pass</small></div>
      <div><b style="color:${ev.jailbreak == null ? 'var(--muted)' : toneVar(ev.jailbreak >= 95 ? 'ok' : 'warn')}">${ev.jailbreak == null ? '—' : ev.jailbreak + '%'}</b><small>Jailbreak resistance</small></div>
      <div><b style="color:${ev.bias === 'Pass' ? 'var(--ok)' : ev.bias === 'n/a' ? 'var(--muted)' : 'var(--warn)'}">${esc(ev.bias)}</b><small>Bias testing</small></div></div></section>
    <section class="panel"><h2>AI Safety Standard evidence</h2><div class="gr">${GUARDRAILS.map((g, i) => `<span class="${r.guardrails[i] ? 'y' : 'n'}">${r.guardrails[i] ? '✓' : '✕'} ${esc(g)}</span>`).join('')}</div></section>
    ${r.notes.length ? `<section class="panel"><h2>Decision history</h2><div class="stack" style="gap:8px">${r.notes.map(n => `<div class="note"><b>${esc(n.decision)}</b> · ${esc(n.by)} · ${esc(n.ts)}${n.text ? `<br>${esc(n.text)}` : ''}</div>`).join('')}</div></section>` : ''}
    ${r.status === 'Pending' ? `<div class="decision"><label for="revNote" class="small" style="font-weight:500">Comments and conditions</label><textarea id="revNote" placeholder="Required when sending back or rejecting. Conditions are attached to the approval."></textarea><div id="revErr" class="small" style="color:var(--crit)" hidden>Add a comment so the submitter knows what to change.</div>
      <div class="row"><button class="btn primary" data-dec="Approved">${ICON.check} Approve</button><button class="btn" data-dec="Approved with conditions">Approve with conditions</button><button class="btn warn" data-dec="Sent back">Send back for more work</button><button class="btn danger" data-dec="Rejected">Reject</button></div></div>` : ''}`;
}
function decide(dec) {
  const r = S.reviews.find(x => x.id === UI.revSel); const txt = ($('#revNote').value || '').trim();
  if ((dec === 'Sent back' || dec === 'Rejected' || dec === 'Approved with conditions') && !txt) { $('#revErr').hidden = false; $('#revNote').focus(); return; }
  r.status = dec; r.notes.push({ decision: dec, by: ME.name, ts: nowStamp(), text: txt });
  const a = r.agentId && agentById(r.agentId);
  if (a) { a.status = dec === 'Rejected' ? 'Suspended' : dec === 'Sent back' ? 'Sent back' : dec; if (dec.startsWith('Approved')) { a.scores.gov = Math.max(a.scores.gov, 80); } }
  audit(ME.name, 'Review', `${r.id} ${r.agent}: ${dec.toLowerCase()}${txt ? ' — ' + txt : ''}`, r.id);
  save(); toast(`${r.agent}: ${dec.toLowerCase()}`);
  const next = S.reviews.find(x => x.status === 'Pending'); UI.revSel = next ? next.id : r.id;
  if (location.hash !== '#reviews') go('reviews'); else rerender();
}

function viewAudit() {

  const refHref = r => /^A\d|^S\d|^G\d/.test(r) ? '#agent-' + r : /^INC-/.test(r) ? '#incident-' + r : /^R-/.test(r) && S.reviews.find(x => x.id === r) ? '#review-' + r : '';
  return `<div class="ph"><div><h1>Audit log</h1><p>A tamper-evident record of every scan, decision, policy change and incident. Each entry is chained to the one before it, so any edit breaks the chain.</p></div>
    <div class="actions"><button class="btn" data-act="verify">${ICON.shield} Verify chain</button><button class="btn primary" data-act="export">${ICON.download} Export auditor pack</button></div></div>

      return `<tr><td class="mono" style="white-space:nowrap">${esc(e.ts)}</td><td class="small">${esc(e.actor)}</td><td>${chip(e.type, e.type === 'Incident' ? 'crit' : e.type === 'Review' ? 'ok' : e.type === 'Scan' ? 'acc' : e.type === 'Policy' ? 'warn' : 'info')}</td><td>${esc(e.text)}</td><td class="mono">${h ? `<a href="${h}">${esc(e.ref)}</a>` : esc(e.ref)}</td><td class="chain" title="prev ${e.prev}">${e.hash}</td></tr>`; }).join('') || '<tr><td colspan="6" class="empty">No matching events.</td></tr>'}</tbody></table></div>`;

function verifyChain() {
  let prev = '0000000000000000', ok = true;
  for (let i = S.audit.length - 1; i >= 0; i--) { const e = S.audit[i]; const h = hash(prev + '|' + e.ts + '|' + e.actor + '|' + e.type + '|' + e.text + '|' + (e.ref || '')); if (e.prev !== prev || e.hash !== h) { ok = false; break; } prev = e.hash; }
  return ok;
}

}

  S.agents.filter(a => (a.name + a.bu + a.owner).toLowerCase().includes(q)).forEach(a => res.push([pt(a.platform, 'sm'), a.name, 'Agent · ' + a.bu, '#agent-' + a.id]));
  mcpInUse().filter(m => MCP[m].name.toLowerCase().includes(q)).forEach(m => { const u = S.agents.find(a => a.tools.some(t => TOOLS[t].via === m)); res.push([pt(MCP[m].host, 'sm'), MCP[m].name, 'MCP server · used by ' + u.name, '#agent-' + u.id]); });
  Object.keys(TOOLS).filter(t => TOOLS[t].name.toLowerCase().includes(q)).forEach(t => { const u = S.agents.find(a => a.tools.includes(t)); if (u) res.push([pt(u.platform, 'sm'), TOOLS[t].name, 'Tool · ' + u.name, '#agent-' + u.id]); });

  const d = t.dataset;

  }

  if (d.revf) { UI.revFilter = d.revf; UI.revSel = null; if (location.hash !== '#reviews') history.replaceState(null, '', '#reviews'); rerender(); return; }

    case 'suspend': { const a = agentById(d.id); a.status = 'Suspended'; audit(ME.name, 'Registry', `${a.id} ${a.name} suspended; credentials revoked at platform`, a.id); save(); toast(`${a.name} suspended`); rerender(); break; }

    case 'dlpack': { try { const b = new Blob([openExport.json], { type: 'application/json' }); const u = URL.createObjectURL(b); const l = document.createElement('a'); l.href = u; l.download = 'harbourline-auditor-pack-2026-10-29.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000); toast('Download started'); } catch (err) { toast('Downloads are blocked in this viewer. Use Copy JSON.'); } break; }
  }

document.addEventListener('change', e => {

});
